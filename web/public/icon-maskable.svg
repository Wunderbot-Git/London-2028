<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- London Wohn-Review: a house at dusk with a lit window — two people deciding on a home. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2B3F9E"/>
      <stop offset="0.55" stop-color="#16206B"/>
      <stop offset="1" stop-color="#0A0F33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.32">
      <stop offset="0" stop-color="#FF8A5B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF8A5B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(51.2 51.2) scale(0.8)"><!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="118" cy="122" r="5" opacity=".85"/>
    <circle cx="392" cy="104" r="4" opacity=".7"/>
    <circle cx="420" cy="196" r="3" opacity=".5"/>
    <circle cx="160" cy="186" r="3" opacity=".5"/>
  </g>
  <!-- house: roof + body as one rounded outline -->
  <path d="M256 146 L392 254 V372 a22 22 0 0 1 -22 22 H142 a22 22 0 0 1 -22 -22 V254 Z"
        fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
  <!-- chimney -->
  <path d="M344 166 V214" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <!-- lit window shaped as a heart -->
  <path d="M256 352 C214 324 196 302 196 280 a30 30 0 0 1 60 -10 a30 30 0 0 1 60 10 c0 22 -18 44 -60 72 Z"
        fill="url(#win)"/>
</g></svg>